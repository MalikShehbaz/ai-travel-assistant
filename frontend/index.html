<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gecko Travels AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-container">

    <header>
        <h1>Gecko Travels Lanka</h1>
        <p>AI Travel Assistant</p>
    </header>

    <main id="chat-box">
        <div class="message assistant">
            Hello! I'm Gecko Travels Lanka's AI travel assistant.
            How can I help you plan your Sri Lanka trip?
        </div>
    </main>

    <form id="chat-form">
        <input
            id="message-input"
            type="text"
            placeholder="Ask about our travel packages..."
            autocomplete="off"
            required
        >

        <button type="submit">Send</button>
    </form>

</div>

<script src="app.js"></script>

</body>
</html>
